name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extras
        run: python -m pip install -e ".[test]"

      - name: Run test suite
        run: python -m pytest

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy sigclean/

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Check formatting (black)
        run: python -m black --check sigclean/ tests/

      - name: Check import order (isort)
        run: python -m isort --check-only sigclean/ tests/

      - name: Lint (flake8)
        run: python -m flake8 sigclean/
